:root{--shell:#2b2b30;--shell2:#141416;--btn:#3d3d46;--pink:#1fa3e0;--teal:#ff9a2a;--lime:#b6ff3b;--ink:#181818;--paper:#fbfbf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;background:radial-gradient(circle at 50% 20%,#232327,#0d0d10 70%);color:#eeeef2;font-family:"Courier New",Courier,monospace;min-height:100%}
#app{--sw:320px;width:calc(100% - 12px);max-width:430px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 6px);min-height:calc(100dvh - 6px);margin-top:6px;border-radius:22px;background:linear-gradient(165deg,#3b3b44 0%,#2a2a30 35%,#232328 70%,#1c1c21 100%);position:relative;overflow:hidden;border-radius:0 0 26px 26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.09),inset 2px 0 0 rgba(255,255,255,.04),inset -2px 0 0 rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.6)}
#app::after{content:'';position:absolute;right:26px;bottom:26px;width:64px;height:44px;background:repeating-linear-gradient(-55deg,transparent 0 5px,rgba(0,0,0,.55) 5px 8px);border-radius:8px;opacity:.7;pointer-events:none}
#led{width:7px;height:7px;border-radius:50%;background:#b6ff3b;box-shadow:0 0 7px #b6ff3b;margin:0 22px 0 auto;display:inline-block;flex:none;animation:led 3s ease-in-out infinite}
@keyframes led{50%{opacity:.55}}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px;font-size:11px;letter-spacing:.2em;position:relative}
#top span{color:var(--lime);text-shadow:1px 1px 0 var(--pink)}
#top button{background:none;border:1px solid var(--teal);color:var(--teal);font:inherit;font-size:11px;padding:3px 0;border-radius:3px;width:86px;text-align:center;flex:none}
#screenwrap{padding:4px 16px 0;position:relative;display:flex;justify-content:center}
#bezel{position:relative;padding:14px;background:linear-gradient(180deg,#0e0e12,#17171c);border-radius:12px;box-shadow:inset 0 5px 12px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.06)}
#screen{width:320px;height:288px;background:#000;border:3px solid #000;box-shadow:0 0 0 2px var(--teal),0 0 0 4px var(--pink),inset 0 0 18px rgba(0,0,0,.6);border-radius:3px;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#textbox{position:absolute;left:17px;right:17px;bottom:17px;height:var(--tbh,98px);margin:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--ink);padding:6px 10px;overflow:hidden;font-size:var(--tbf,13px);line-height:1.4;visibility:hidden;z-index:3}
#textbox.on{visibility:visible}
#tbtext{white-space:pre-wrap}
#tbup,#tbdn{position:absolute;right:3px;font-size:9px;line-height:1;display:none}#tbdn{bottom:3px}#tbup.on,#tbdn.on{display:block}
#cue{position:absolute;right:3px;bottom:2px;font-size:12px;display:none;animation:bob .6s steps(2) infinite}
#cue.on{display:block}
@keyframes bob{50%{transform:translateY(-2px)}}
#tbopts{display:grid;gap:1px 10px;margin-top:4px;min-width:0}
#tbopts button{background:none;border:none;font:inherit;font-size:1em;color:var(--ink);text-align:left;padding:1px 0 1px 16px;position:relative;line-height:1.25;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbopts.two button small{display:block;margin-left:0}
#tbopts button.sel::before{content:"▶";position:absolute;left:0}
#tbopts button small{opacity:.65;font-size:.85em;margin-left:6px;display:inline}
#controls{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 4px;position:relative;gap:24px}
#dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:2px;flex:none;padding:8px;background:radial-gradient(circle,#1a1a1e 0%,#202024 70%,#26262c 100%);border-radius:50%;box-shadow:inset 0 3px 8px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.05)}
#dpad button{background:linear-gradient(180deg,#3a3a42,#2e2e34);border:none;color:#d8d8e0;font-size:18px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 #1a1a1e;text-shadow:0 -1px 0 rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.18);transition:transform .05s,box-shadow .05s}
#dpad button:active,#dpad button.down{background:#25252a;box-shadow:inset 0 2px 4px rgba(0,0,0,.7);transform:translateY(2px)}
#dpad .c{background:#26262c;border-radius:0;box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
#dpad .blank{visibility:hidden}
#ab{display:flex;gap:16px;align-items:center;flex:none;padding:14px 12px;background:#1f1f24;border-radius:60px;box-shadow:inset 0 3px 8px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.06),0 1px 0 rgba(255,255,255,.05);transform:rotate(-14deg)}
.rb{width:62px;height:62px;border-radius:50%;border:none;color:#fff;font:inherit;font-weight:700;font-size:18px;background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 45%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2),0 2px 3px rgba(0,0,0,.5)}
.rb:active,.rb.down{box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15),0 0 0 rgba(0,0,0,0);filter:brightness(1.06)}
#btnA,#btnB{color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.35);transform:rotate(14deg);transition:transform .05s,box-shadow .05s}#btnA{background-color:var(--pink)}#btnB{background-color:var(--teal)}
#btnA:active,#btnB:active,#btnA.down,#btnB.down{transform:rotate(14deg) translateY(3px)}
#sel{display:flex;justify-content:center;gap:32px;padding:14px 0 10px;position:relative}
#sel button{background:linear-gradient(180deg,#4a4a54,#35353d);border:none;color:#c8c8d2;font:inherit;font-size:10px;letter-spacing:.15em;padding:6px 16px;border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 #1a1a1e,0 2px 2px rgba(0,0,0,.6);text-shadow:0 -1px 0 rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.2);transform:rotate(-14deg);transition:transform .05s,box-shadow .05s}
#sel button:active{transform:rotate(-14deg) translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 #1a1a1e,0 0 0 rgba(0,0,0,0)}
#hint{font-size:9px;text-align:center;opacity:.5;padding:2px 16px 4px;position:relative;margin-top:auto}
#legal{font-size:8px;text-align:center;opacity:.35;padding:0 16px 10px;line-height:1.3}

body{overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom)}
#menu{position:absolute;inset:0;display:none;flex-direction:column;background:linear-gradient(165deg,#3b3b44 0%,#2a2a30 35%,#232328 70%,#1c1c21 100%);z-index:5;padding:10px 12px 12px;border-radius:22px;color:var(--ink);font-size:13px;font-family:"RadPix","Courier New",monospace;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}

#menu h2{font-size:16px;margin:0 0 8px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;color:var(--ink);text-shadow:2px 2px 0 var(--pink)}
#menu h2 span:last-child{background:var(--ink);color:var(--lime);padding:3px 8px;font-size:13px;letter-spacing:.05em;text-shadow:none}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1;background:#fff;border:2px solid var(--ink);font:inherit;font-size:11px;letter-spacing:.04em;padding:7px 2px;color:var(--ink);text-transform:uppercase;line-height:1.2;box-shadow:2px 2px 0 var(--ink)}.tabs button.on{background:var(--pink);color:#fff;box-shadow:none;transform:translate(2px,2px)}
.bag{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;font-size:10px;letter-spacing:.05em}
.bag span{border:2px solid var(--ink);padding:3px 6px;background:var(--lime);font-size:11px}
#plist{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.row{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);padding:6px 8px;margin-bottom:6px;background:#fff}
.row.lead{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--ink)}
.row.dead{opacity:.5}
.row canvas{width:48px;height:48px;image-rendering:pixelated;flex:none;background:#c8f0a8;border:2px solid var(--ink)}
.row .info{flex:1;min-width:0;line-height:1.5;font-size:12px}
.row .info b{font-size:13px;letter-spacing:.04em}
.row .setbtn{margin-left:auto;flex:none;min-width:92px;background:var(--paper);border:2px solid var(--ink);font:inherit;font-size:12px;padding:4px 8px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.row .setbtn:active{transform:translateY(2px);box-shadow:none}
.row .acts{display:flex;flex-direction:column;gap:4px;flex:none}
.row .acts button,#menu .close{background:var(--teal);border:2px solid var(--ink);font:inherit;font-size:11px;letter-spacing:.06em;padding:6px 8px;color:var(--ink);text-transform:uppercase;box-shadow:2px 2px 0 var(--ink)}
.row .acts button:active,#menu .close:active{transform:translate(2px,2px);box-shadow:none}
.row .acts button:disabled{opacity:.35;box-shadow:none}
#menu .close{margin-top:8px;padding:10px;font-size:14px;letter-spacing:.15em;background:var(--pink);color:#fff}
.hpbar{height:8px;border:2px solid var(--ink);margin:3px 0;background:#e8e8e8}.hpbar i{display:block;height:100%;background:#48c848}

function stamp(rows,ov,x0,y0){rows=rows.slice();ov.forEach((r,i)=>{const y=y0+i;if(y<0||y>=24)return;let out=rows[y].split('');for(let x=0;x<r.length;x++){const X=x0+x;if(X<0||X>=24||r[x]==='.')continue;out[X]=r[x];}rows[y]=out.join('');});return rows;}
function buildArt(spec){const A=GANCH[spec.body];let rows=GBODY[spec.body].slice();
  for(const f of (spec.feats||[])){const F=FEATS[f];if(!F)continue;
    if(F.at==='top'){const w=F.rows[0].length;rows=stamp(rows,F.rows,Math.round((A.ex[0]+A.ex[1]+2)/2-w/2),A.ty-F.rows.length+1);}
    else if(F.at==='side'){rows=stamp(rows,F.rows.map(r=>r.split('').reverse().join('')),A.hx[0]-F.rows[0].length+1,A.hy);rows=stamp(rows,F.rows,A.hx[1],A.hy);}
    else if(F.at==='tail')rows=stamp(rows,F.rows,19,15);
    else if(F.at==='belly')rows=stamp(rows,F.rows,Math.round((A.ex[0]+A.ex[1]+2)/2-F.rows[0].length/2),A.my+3);}
  const E=EYES[spec.eyes||'big'];const eyOff=E.rows.length>3?-1:0;
  if(E.w>=5){rows=stamp(rows,E.rows,Math.round((A.ex[0]+A.ex[1]+2)/2-E.w/2),A.ey+eyOff);}
  else{rows=stamp(rows,E.rows,A.ex[0],A.ey+eyOff);rows=stamp(rows,E.rows.map(r=>r.split('').reverse().join('')),A.ex[1],A.ey+eyOff);}
  const Mo=MOUTHS[spec.mouth||'grin'];if(Mo.length)rows=stamp(rows,Mo,Math.round((A.ex[0]+A.ex[1]+2)/2-Mo[0].length/2),A.my);
  return rows;}

    if(!d.children.length)d.innerHTML='<div class="row"><div class="info">Empty. Just crumbs.</div></div>';return;}
  if(tab==='D'){const g=document.createElement('div');g.className='dex';DEX.forEach(n=>{const c=document.createElement('div');const known=G.seen[n];c.className=known?'':'unk';const cv2=document.createElement('canvas');cv2.width=MONSPR[n].width;cv2.height=MONSPR[n].height;cv2.getContext('2d').drawImage(MONSPR[n],0,0);if(!known)cv2.style.filter='brightness(0)';c.appendChild(cv2);const lb=document.createElement('div');lb.textContent=`#${String(SPECIES[n].n).padStart(3,'0')} ${known?n.toUpperCase():'???'}${G.caught[n]?' ✓':''}${(G.holo||{})[n]?' ✦':''}`;c.appendChild(lb);
      c.onclick=async()=>{if(!known)return;closeMenu();await say(`#${SPECIES[n].n} ${n.toUpperCase()} (${SPECIES[n].type})\n${SPECIES[n].desc}\n${habitat(n)}`);closeText();};g.appendChild(c);});d.appendChild(g);
    const s=document.createElement('div');s.style.cssText='font-size:11px;margin-top:8px';s.textContent=`Seen ${Object.keys(G.seen).length} · Caught ${Object.keys(G.caught).length} of ${DEX.length}`+(G.flags.tamaCaught?' · PIXELGODCHI ✦':'');d.appendChild(s);return;}
  if(!G.party.length){d.innerHTML='<div class="row"><div class="info">No Radimals yet. PROF. DIALTONE is in the lab (north-west, pink roof).</div></div>';return;}
  G.party.forEach((m,i)=>{const f=Math.max(0,m.hp/m.st.hp);const r=document.createElement('div');r.className='row'+(i===0?' lead':'')+(m.hp<=0?' dead':'');const c=document.createElement('canvas');c.width=spr(m).width;c.height=spr(m).height;c.getContext('2d').drawImage(spr(m),0,0);r.appendChild(c);
    const info=document.createElement('div');info.className='info';info.innerHTML=`<b>${m.holo?'✦ HOLO ':''}${m.name.toUpperCase()}</b> L${m.lv}${typeTag(SPECIES[m.name].type)}${i===0?' · lead':''}<div class="hpbar"><i style="width:${f*100}%;background:${f>.5?'#48c848':f>.2?'#f8c030':'#e04040'}"></i></div>${Math.max(0,m.hp)}/${m.st.hp} HP · ATK ${m.st.atk} DEF ${m.st.def} SPD ${m.st.spd}<br>${m.moves.join(', ')}<br>Next level in ${(m.lv+1)**3-m.exp} EXP`;r.appendChild(info);
    const a=document.createElement('div');a.className='acts';if(i>0){const b=document.createElement('button');b.textContent='LEAD';b.onclick=()=>{G.party.splice(i,1);G.party.unshift(m);sfx('select');renderMenu();};a.appendChild(b);}
    const t=document.createElement('button');t.textContent='JUICE';t.disabled=bagN('juice')<=0||m.hp>=m.st.hp;t.onclick=()=>{G.bag.juice--;m.hp=Math.min(m.st.hp,m.hp+30);sfx('heal');renderMenu();};a.appendChild(t);r.appendChild(a);d.appendChild(r);});}
$('#btnStart').onclick=openMenu;$('#btnClose').onclick=closeMenu;['P','B','D','H'].forEach(k=>$('#tab'+k).onclick=()=>{tab=k;sfx('tick');renderMenu();});

/* =============== save / load =============== */
let memSave={};
async function save(){if(M().npcs.some(n=>n.special==='sleep'))G.flags.lastSleep=G.map;G.playT=playT;const s=JSON.stringify(G);memSave[SLOT]=s;try{localStorage.setItem(SAVEKEY(),s);}catch(e){}try{if(window.storage)await window.storage.set(SAVEKEY(),s,false);}catch(e){}}
/* autosave: when the app is backgrounded/closed and after every door or route change (only once a game is underway) */
function autosave(){if(mode==='title'||!G.flags.starter)return;try{save();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave();});window.addEventListener('pagehide',autosave);
async function load(slot){const key='radimals98v3_s'+slot;try{if(window.storage){const r=await window.storage.get(key,false);if(r&&r.value)return r.value;}}catch(e){}try{const v=localStorage.getItem(key);if(v)return v;}catch(e){}return memSave[slot]||null;}
async function delSave(slot){const key='radimals98v3_s'+slot;delete memSave[slot];try{if(window.storage)await window.storage.delete(key,false);}catch(e){}try{localStorage.removeItem(key);}catch(e){}}
function slotLabel(d){if(!d)return 'EMPTY';const h=Math.floor((d.playT||0)/3600000),m=Math.floor((d.playT||0)/60000)%60;return `${d.party&&d.party[0]?d.party[0].name.toUpperCase():'NO TEAM'} · ${(d.caps||d.pogs||[]).length}★ · ${h}:${String(m).padStart(2,'0')}${d.flags&&d.flags.champion?' CHAMP':''}`;}
$('#btnSave').onclick=async()=>{if(mode!=='map'||busy||textOpen)return;await save();await say('Progress saved to a floppy disk. Label it. Don\'t lose it.');closeText();};

/* =============== input =============== */
function pressDir(d){codeKey(d);if(menuState){menuState.move(d);return;}held.add(d);}
document.querySelectorAll('#dpad button[data-d]').forEach(b=>{const d=b.dataset.d;const on=e=>{e.preventDefault();initAudio();buzz('light');b.classList.add('down');pressDir(d);};const off=()=>{b.classList.remove('down');held.delete(d);};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);});
function pressA(){initAudio();if(mode==='title'){const was=cheat;codeKey('a');if(!was&&cheat)return;startGame();return;}if(mode==='mapview'){mode='map';return;}if(menuState){menuState.a();return;}if(textOpen){advance();return;}onA();}
function pressB(){initAudio();bHeld=true;if(mode==='title'){codeKey('b');return;}if(mode==='mapview'){mode='map';return;}if(menuState){menuState.b();return;}if(textOpen){advance();return;}if(mode==='menu'){closeMenu();return;}}
function releaseB(){bHeld=false;}
$('#btnA').addEventListener('pointerdown',e=>{e.preventDefault();buzz('light');e.currentTarget.classList.add('down');pressA();});['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#btnA').addEventListener(ev,e=>e.currentTarget.classList.remove('down')));
$('#btnB').addEventListener('pointerdown',e=>{e.preventDefault();buzz('light');e.currentTarget.classList.add('down');pressB();});['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#btnB').addEventListener(ev,e=>{e.currentTarget.classList.remove('down');releaseB();}));
tb.addEventListener('click',()=>{if(!menuState)advance();});
cv.addEventListener('pointerdown',()=>{if(mode==='title')pressA();});
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
document.addEventListener('keydown',e=>{if(e.repeat)return;const k=KEYS[e.key];initAudio();
  if(k){e.preventDefault();pressDir(k);}else if(e.key==='z'||e.key==='Enter'||e.key===' '){e.preventDefault();pressA();}else if(e.key==='x'||e.key==='Escape'||e.key==='Backspace'){e.preventDefault();pressB();}else if(e.key==='m'&&mode==='map')openMenu();});
document.addEventListener('keyup',e=>{const k=KEYS[e.key];if(k)held.delete(k);if(e.key==='x'||e.key==='Escape'||e.key==='Backspace')releaseB();});
document.addEventListener('pointerdown',initAudio,{passive:true});

/* =============== main loop =============== */
let last=performance.now();
const TOASTERS=[];function drawScreensaver(dt){if(TOASTERS.length<5&&Math.random()<0.02)TOASTERS.push({x:170,y:rnd(-10,120),s:rnd(15,35)/1000,f:0});ctx.fillStyle='rgba(8,8,14,0.35)';ctx.fillRect(0,0,160,144);for(const t of TOASTERS){t.x-=t.s*dt;t.y+=t.s*dt*0.5;ctx.save();ctx.translate(t.x,t.y);ctx.scale(36/MONSPR.Toastwing.width,36/MONSPR.Toastwing.width);ctx.drawImage(MONSPR.Toastwing,0,0);ctx.restore();}for(let i=TOASTERS.length-1;i>=0;i--)if(TOASTERS[i].x<-40||TOASTERS[i].y>150)TOASTERS.splice(i,1);txt('SCREENSAVER',58,132,'#fbfbf4');}
function loop(now){const dt=Math.min(50,now-last);last=now;frameCount++;bumpT-=dt;if(mode!=='title')playT+=dt;if(mode==='map'&&!textOpen&&!busy&&!held.size&&!P.moving)idleT+=dt;else{idleT=0;TOASTERS.length=0;}
  if(B.garble){for(let i=0;i<40;i++){ctx.fillStyle=['#b6ff3b','#ff9a2a','#1fa3e0','#181818','#fbfbf4'][rnd(0,4)];ctx.fillRect(rnd(0,152),rnd(0,136),rnd(4,24),rnd(2,8));}requestAnimationFrame(loop);return;}
  if(mode==='title')drawTitle();
  else if(mode==='mapview')drawMapView();
  else if(mode==='map'||mode==='menu'){if(!P.moving&&held.size&&mode==='map'){tryStep([...held].pop());}updateMove(dt);drawMap();if(idleT>45000&&mode==='map')drawScreensaver(dt);}
  else if(mode==='battle'){if(B.en||B.me)drawBattle();else drawMap();}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
let starting=false;
async function startGame(){if(starting)return;starting=true;sfx('modem');mode='map';
  const saves=[];for(let i=1;i<=3;i++){const v=await load(i);saves.push(v?JSON.parse(v):null);}
  while(true){const i=await pickMenu(saves.map((d,k)=>({label:'FLOPPY '+(k+1),sub:slotLabel(d)})),{text:'Pick a floppy disk.',cancel:false});SLOT=i+1;
    if(saves[i]){const j=await choose(`FLOPPY ${SLOT}: ${slotLabel(saves[i])}`,['CONTINUE','NEW GAME','ERASE','BACK']);
      if(j===0){Object.assign(G,saves[i]);G.key=G.key||{};G.repel=G.repel||0;playT=G.playT||0;heroSpr=personSet(G.bike?BIKE_LOOK:PLAYER_LOOK);closeText();playTrack(mapMusic());return;}
      if(j===1){const c=await choose('Start over on this floppy? The old save is gone forever. Like your slap bracelet.',['YES, ERASE IT','NO']);if(c===0)break;continue;}
      if(j===2){const c=await choose('Erase this floppy?',['YES','NO']);if(c===0){await delSave(SLOT);saves[i]=null;}continue;}
      continue;}
    break;}
  playT=0;playTrack('town');if(cheat){G.bag.slammer=30;G.bag.tape_cheatcode=1;G.flags.cheat=1;await say('The cartridge glitches. Something whispers: "...thirty lives." You find 30 SLAMMERS and a MIX TAPE: CHEAT CODE in your backpack. Nobody saw anything.');}await say('HOW TO PLAY: A talks, confirms and reads signs. B opens the menu and backs out. Hold B while walking to run. It\'s all in MENU > HELP if you forget.');
  await say('DIAL-UP DOWNS. December 1999. Someone\'s modem is screaming. It\'s always someone\'s modem.');
  await say('Your house is right behind you. The lab with the PINK roof is across the path. Walk up to people and signs and press A. Hold B to run like you\'re late for the bus.');closeText();}
</script>
