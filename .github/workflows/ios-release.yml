name: iOS release build (TestFlight)
# Run by hand from the Actions tab. Generates the iOS project from www/ (the ios/ folder is not
# committed), builds a signed iPhone app and uploads it to App Store Connect. It shows up in
# TestFlight after Apple finishes processing (about 10-30 minutes).
# Signing is automatic through an App Store Connect API key (Admin role); no certificates are stored here.
# Needs repo secrets: APPSTORE_API_KEY_P8 (contents of the .p8 file), APPSTORE_API_KEY_ID,
# APPSTORE_API_ISSUER_ID, APPLE_TEAM_ID.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version shown in the App Store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check signing secrets
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$KEY" -a -n "$TEAM" || { echo "::error::App Store Connect secrets are missing. Add them under Settings > Secrets and variables > Actions."; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Generate the iOS project, icons and splash
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios
      - name: iPhone only, portrait only, no encryption questions
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$P" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$P"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarStyle string UIStatusBarStyleLightContent" "$P" || /usr/libexec/PlistBuddy -c "Set :UIStatusBarStyle UIStatusBarStyleLightContent" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$P" || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" "$P"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios
      - name: Use the newest Xcode (App Store requires the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          test -n "$X" || { echo "::error::No Xcode 26+ on this runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Archive and upload to App Store Connect
        shell: bash
        env:
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          BUILD=$((100 + ${{ github.run_number }}))
          # Capacitor 6 uses CocoaPods, so build the workspace rather than the bare project.
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION='${{ inputs.versionName }}' CURRENT_PROJECT_VERSION=$BUILD \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" 2>&1 | tee export.log | tail -30
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
          rm -f "$KEY_PATH"
          echo "Uploaded version ${{ inputs.versionName }} (build $BUILD). It appears in TestFlight after Apple processes it."
