<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radimals Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{--navy:#0e1e2c;--navy2:#132a3c;--paper:#fbfbf4;--ink:#181818;--bondi:#1fa3e0;--orange:#ff9a2a;--lime:#b6ff3b;--pink:#ff3fa4;--muted:#9fc3d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0e1e2c;--navy2:#132a3c;--paper:#fbfbf4;--ink:#181818;--bondi:#1fa3e0;--orange:#ff9a2a;--lime:#b6ff3b;--pink:#ff3fa4;--muted:#9fc3d6}}
:root[data-theme="dark"]{--navy:#0e1e2c;--navy2:#132a3c;--paper:#fbfbf4;--ink:#181818;--bondi:#1fa3e0;--orange:#ff9a2a;--lime:#b6ff3b;--pink:#ff3fa4;--muted:#9fc3d6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--navy);color:var(--paper);font-family:"VT323","Courier New",monospace;font-size:20px;line-height:1.3;-webkit-font-smoothing:none;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.wrap{position:relative;max-width:1040px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font:normal 26px/1.1 "RadPix","Courier New",monospace;letter-spacing:.06em;text-shadow:3px 3px 0 var(--bondi)}
h1 small{display:block;font-size:11px;letter-spacing:.2em;color:var(--lime);text-shadow:none;margin-top:8px}
header{margin-bottom:14px}
.tv{position:relative;background:#2b2b30;border:4px solid var(--ink);border-radius:18px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 0 0 3px #45454c}
.tv:fullscreen{border:0;border-radius:0;padding:0;background:#000;display:flex;align-items:center;justify-content:center}
.tv:fullscreen canvas{width:auto;height:100%;max-width:100%;object-fit:contain;border-radius:0}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;image-rendering:pixelated}
.start{position:absolute;inset:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:0;border-radius:10px;background:rgba(14,30,44,.55);color:var(--paper);cursor:pointer;font:normal 22px "RadPix",monospace;letter-spacing:.08em}
.start span{background:var(--pink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 18px;animation:blink 1s steps(2) infinite}
.start em{font:normal 20px "VT323",monospace;font-style:normal;color:var(--lime);text-shadow:2px 2px 0 var(--ink)}
.start[hidden]{display:none}
@keyframes blink{50%{background:var(--orange)}}
@media (prefers-reduced-motion:reduce){.start span{animation:none}}
.rec{position:absolute;top:24px;right:28px;font:normal 12px "RadPix",monospace;color:#fff;background:#d01818;padding:4px 8px;letter-spacing:.1em}
.rec[hidden]{display:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.btn{font:normal 11px "RadPix",monospace;letter-spacing:.08em;padding:9px 11px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;min-height:36px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.hot{background:var(--lime)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#scrub{flex:1 1 200px;min-width:140px;accent-color:var(--pink);height:24px}
.time{font-variant-numeric:tabular-nums;color:var(--lime);min-width:96px;text-align:center}
.note{color:var(--muted);font-size:18px;margin:14px 0 0}
@media (max-width:560px){h1{font-size:18px}.tv{padding:8px;border-radius:12px}.start{inset:8px;font-size:15px}.start span{padding:9px 12px}.btn{font-size:10px;padding:8px 9px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>TOTALLY RADIMALS '98<small>OFFICIAL PROMO TAPE · 81 SECONDS · SOUND ON</small></h1></header>
  <div class="tv" id="tv">
    <canvas id="screen" width="960" height="540" aria-label="Animated Totally Radimals '98 promo"></canvas>
    <button class="start" id="start" hidden><span>▶ PRESS START</span><em>Loading the tape...</em></button>
    <span class="rec" id="rec" hidden>● REC</span>
  </div>
  <div class="controls">
    <button class="btn hot" id="play">PLAY</button>
    <button class="btn" id="restart">REWIND</button>
    <input type="range" id="scrub" min="0" max="81" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 1:21</span>
    <button class="btn" id="mute">SOUND ON</button>
    <button class="btn" id="full">FULL</button>
    <button class="btn" id="save">SAVE VIDEO</button>
  </div>
  <p class="note">Every sprite, scene and catchphrase comes from the Radimals Binder. SAVE VIDEO records the whole promo in real time and downloads a .webm file.</p>
</div>
<script src="radimals-data.js"></script>
<script>
(()=>{
// ---------- setup ----------
const W=480,H=270,SC=2,DUR=81;
const INK='#181818',PAPER='#fbfbf4',BONDI='#1fa3e0',ORANGE='#ff9a2a',LIME='#b6ff3b',PINK='#ff3fa4',NAVY='#0e1e2c';
const TYPES={Basic:'#c8bda0',Fire:'#ff6a2a',Water:'#3a9bff',Grass:'#5fe05a',Bug:'#c6ef3a',Rock:'#c8a070',Air:'#a8e0ff',Techno:'#ff3fa4'};
const cv=document.getElementById('screen'),ctx=cv.getContext('2d');
const R=window.RADIMALS,BY={};R.forEach(r=>BY[r.name]=r);
const IM={},HE={},SIL={};
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eBack=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const eBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
const pad=(n,l=3)=>String(n).padStart(l,'0');

function loadImg(src){const i=new Image();i.src=src;return i}
R.forEach(r=>{IM[r.name]=loadImg(r.spr);if(r.hero)HE[r.name]=loadImg(r.hero)});
function makeSil(name,col){const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(IM[name],0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,24,24);return c}

// ---------- drawing helpers ----------
function spr(name,cx,cy,s,o={}){
  const img=o.sil?SIL[o.sil]:IM[name];const w=24*s;
  ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.translate(cx,cy);if(o.rot)ctx.rotate(o.rot);if(o.flip)ctx.scale(-1,1);
  ctx.drawImage(img,-w/2,-w/2,w,w);ctx.restore();
}
function hero(name,zoom=1,ox=0,oy=0){const s=4.5*zoom,w=120*s,h=60*s;ctx.drawImage(HE[name],(W-w)/2+ox,(H-h)/2+oy,w,h)}
function txt(s,x,y,sz,col,o={}){
  ctx.font=`${sz}px ${FF(o.f)}`;ctx.textAlign=o.a||'center';ctx.textBaseline='middle';
  const ol=o.ol??Math.max(1,Math.round(sz/12));
  const draw=(dx,dy,c)=>{ctx.fillStyle=o.oc||INK;if(ol>0)for(let i=-ol;i<=ol;i++)for(let j=-ol;j<=ol;j++)if(i||j)ctx.fillText(s,x+dx+i,y+dy+j);ctx.fillStyle=c;ctx.fillText(s,x+dx,y+dy)};
  if(o.sh){const d=o.sd||Math.max(2,sz/12);ctx.save();ctx.fillStyle=o.sh;if(ol>0)for(let i=-ol;i<=ol;i++)for(let j=-ol;j<=ol;j++)ctx.fillText(s,x+d+i,y+d+j);ctx.fillText(s,x+d,y+d);ctx.restore()}
  draw(0,0,col);
}
function wrap(s,maxW,sz,f='VT323'){const out=[];let line='';s.split(' ').forEach(w=>{const tst=line?line+' '+w:w;if(line&&tw(tst,sz,f)>maxW){out.push(line);line=w}else line=tst});out.push(line);return out}
const FF=f=>f==='VT323'?'VT323,"Courier New",monospace':'RadPix,monospace';
function tw(s,sz,f='RadPix'){ctx.font=`${sz}px ${FF(f)}`;return ctx.measureText(s).width}
function typed(s,t0,T,spd=.035){return s.slice(0,Math.max(0,Math.floor((T-t0)/spd)))}
function box(x,y,w,h,fill,bw=2){ctx.fillStyle=INK;ctx.fillRect(x-bw,y-bw,w+bw*2,h+bw*2);ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
function tbox(x,y,w,h){ctx.fillStyle=INK;ctx.fillRect(x,y,w,h);ctx.fillStyle=PAPER;ctx.fillRect(x+3,y+3,w-6,h-6);ctx.fillStyle=INK;ctx.fillRect(x+5,y+5,w-10,h-10);ctx.fillStyle=PAPER;ctx.fillRect(x+7,y+7,w-14,h-14)}
function burst(cx,cy,rot,c1,c2,n=18){ctx.fillStyle=c1;ctx.fillRect(0,0,W,H);ctx.fillStyle=c2;for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n,b=a+Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*700,cy+Math.sin(a)*700);ctx.lineTo(cx+Math.cos(b)*700,cy+Math.sin(b)*700);ctx.fill()}}
function star(cx,cy,r1,r2,n,rot,fill,stroke=INK){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=rot+i*Math.PI/n;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke()}
function tag(type,x,y,sz=8){const s=type.toUpperCase(),w=tw(s,sz)+8;box(x,y,w,sz+6,TYPES[type]);txt(s,x+4,y+sz/2+3,sz,INK,{a:'left',ol:0});return w}
function dots(bg,dot,step=8){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=dot;for(let y=4;y<H;y+=step)for(let x=4;x<W;x+=step)ctx.fillRect(x,y,1,1)}
function flash(a,c='#fff'){if(a<=0)return;ctx.globalAlpha=cl(a);ctx.fillStyle=c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
function bubble(s,x,y,sz=16,fill=PAPER,f='RadPix'){ // speech bubble centered at x, bottom tail
  const w=tw(s,sz,f)+20,h=sz+16;box(x-w/2,y-h/2,w,h,fill,3);
  ctx.fillStyle=INK;ctx.beginPath();ctx.moveTo(x-8,y+h/2+3);ctx.lineTo(x+4,y+h/2+16);ctx.lineTo(x+10,y+h/2+3);ctx.fill();
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x-4,y+h/2);ctx.lineTo(x+4,y+h/2+10);ctx.lineTo(x+6,y+h/2);ctx.fill();
  txt(s,x,y+1,sz,INK,{ol:0,f});
}
function binder(x,y,rot=0,s=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);box(-10,-13,20,26,BONDI,2);ctx.fillStyle=PAPER;ctx.fillRect(-4,-8,11,7);ctx.fillStyle=INK;for(let i=0;i<3;i++)ctx.fillRect(-12,-9+i*8,5,3);ctx.fillStyle=LIME;ctx.fillRect(-4,4,11,3);ctx.restore()}
const NOISE=[...Array(4)].map(()=>{const c=document.createElement('canvas');c.width=120;c.height=68;const x=c.getContext('2d'),d=x.createImageData(120,68);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c});
function staticNoise(a,x=0,y=0,w=W,h=H){if(a<=0)return;ctx.globalAlpha=a;ctx.drawImage(NOISE[(performance.now()/50|0)%4],x,y,w,h);ctx.globalAlpha=1}
function shake(amt){if(amt>0)ctx.translate((Math.random()-.5)*amt*2,(Math.random()-.5)*amt*2)}

// ---------- scenes ----------
const TYPE_ROLL=[
 ['Fire',['Lavalamprey','Inflamingo','Hotpockit'],'Handle with oven mitts.'],
 ['Water',['Hangryhippo','Bubblewrapir','Goopopus'],'Pump it forty times.'],
 ['Grass',['Grungehog','Cabbagelord','Dandylion'],'Just add water. Wait three weeks.'],
 ['Bug',['Y2Kroach','Ladybugsy','Rantzilla'],'Banned at recess.'],
 ['Rock',['VHSaur','Petrocksteady','Brickzilla'],'Be kind. Rewind.'],
 ['Air',['Fuzzbeak','Aquanetta','Parachuteor'],'Totally airbrushed.'],
 ['Techno',['Pagerpup','Toastwing','Bufferfly'],"You've got Radimals!"],
 ['Basic',['Milkwog','Hamsterrave','Mallratking'],'Worth thousands one day. (Not.)'],
];
const STARTERS=['Dialupine','Floppuss','Trollsprout'];
const MONTAGE=['Pagerpup','Boppurr','Rewindosaur','Blowcart','Petrock','Chatbrat','Parachuteor','Hamsterrave','Bufferfly'];
const ORBIT=['Dialupine','Floppuss','Trollsprout','Pagerpup','Y2Kraken','Petrocksteady','Toastwing','Hamsterrave','Pixelgodchi','Boppurr'];
const VHS_LINES=[[1.4,'THE YEAR IS 1998.'],[2.5,'THE PHONE LINE IS TIED UP.'],[3.6,'SOMETHING IS DIALING IN...']];
const BATTLE_MSG=[[.6,'A wild TROLLSPROUT appeared!'],[2.2,'Go! DIALUPINE!'],[3.6,'DIALUPINE used FLAME BROIL!'],[5.4,"It's TOTALLY effective!"],[6.6,'You threw a BINDER!'],[8.7,'RRRRIP! TROLLSPROUT was filed!']];

function osd(label,T,tri=true){
  txt(label,22,24,16,PAPER,{a:'left',ol:0,sh:'rgba(0,0,0,.6)',sd:2});
  const x=22+tw(label,16)+8;ctx.fillStyle=PAPER;ctx.beginPath();
  if(tri){ctx.moveTo(x,17);ctx.lineTo(x+12,24);ctx.lineTo(x,31)}else ctx.rect(x,18,12,12);ctx.fill();
  const s=Math.floor(T);txt(`SP  0:${pad(Math.floor(s/60),2)}:${pad(s%60,2)}`,W-22,H-22,16,PAPER,{a:'right',ol:0,sh:'rgba(0,0,0,.6)',sd:2});
}

function sVhs(t,T){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(t<1.2){ctx.fillStyle='#1b2fd8';ctx.fillRect(0,0,W,H);staticNoise(t<.15?.8:0)}
  else{staticNoise(Math.max(.07,.9-(t-1.2)*3));
    const by=((t-1.2)*160)%(H+40)-20;ctx.globalAlpha=.25;ctx.drawImage(NOISE[0],0,by,W,14);ctx.globalAlpha=1;
    VHS_LINES.forEach(([t0,s],i)=>{if(t>=t0)txt(typed(s,t0,t),W/2,98+i*34,16,i==2?LIME:PAPER,{sh:'#000',sd:2})});
    if(t>4.3&&Math.floor(t*6)%2){ctx.fillStyle=LIME;ctx.fillRect(W/2+tw(VHS_LINES[2][1],16)/2+6,160,8,13)}
  }
  osd('PLAY',T);
}

function monitor(){
  ctx.fillStyle='#a8a08a';ctx.fillRect(200,196,80,14);ctx.fillStyle='#c8c0a8';ctx.fillRect(176,206,128,12);
  box(128,32,224,166,'#d8d0b8',3);ctx.fillStyle='#bfb79e';ctx.fillRect(128,184,224,14);
  box(144,46,192,130,'#081a10',3);ctx.fillStyle='#ff9a2a';ctx.fillRect(320,188,8,4);
  txt('RADTRON 98',150,191,8,'#6b654f',{a:'left',ol:0});
}
function taskbar(){ctx.fillStyle='#c0c0c0';ctx.fillRect(0,H-18,W,18);ctx.fillStyle='#fff';ctx.fillRect(0,H-18,W,1);box(4,H-15,50,12,'#c0c0c0',1);txt('START',29,H-9,8,INK,{ol:0});box(W-64,H-15,60,12,'#b0b0b0',1);txt('11:59 PM',W-34,H-9,8,INK,{ol:0})}
function sDial(t,T){
  ctx.fillStyle='#008080';ctx.fillRect(0,0,W,H);taskbar();
  ctx.save();if(t>2.5&&t<4.6)shake(2*(1-pr(t,3.8,4.6)));
  monitor();
  if(t<2.5){
    txt('ATDT 555-7237',156,64,16,'#48ff78',{a:'left',ol:0,f:'VT323'});
    if(t>.9)txt('CONNECTING'+'.'.repeat(Math.floor(t*4)%4),156,84,16,'#48ff78',{a:'left',ol:0,f:'VT323'});
    ctx.fillStyle='#1e4a2a';ctx.fillRect(156,152,168,10);ctx.fillStyle='#48ff78';ctx.fillRect(156,152,168*pr(t,.3,2.4),10);
    if(t>1.3){ctx.strokeStyle='#48ff78';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<168;x++){const y=120+Math.sin(x*.3+t*40)*8*Math.sin(x*.05+t*9);x?ctx.lineTo(156+x,y):ctx.moveTo(156+x,y)}ctx.stroke()}
  }else{
    staticNoise(.9,147,49,186,124);
    for(let i=0;i<4;i++){const r=((t-2.5)*140+i*40)%200;ctx.strokeStyle=`rgba(182,255,59,${1-r/200})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(240,118,r,0,Math.PI*2);ctx.stroke()}
    const k=eBack(pr(t,2.5,2.95));spr('Dialupine',lerp(240,240,k),lerp(112,140,k),lerp(1.5,5.5,k));
    if(t>2.8)bubble(typed('EEEEE-AWWW-KSHHHHH.',2.8,t,.06),240,26,16);
  }
  ctx.restore();
  if(t>4.4){const k=eBack(pr(t,4.4,4.65));ctx.save();ctx.translate(376,214);ctx.rotate(-.14);ctx.scale(k,k);box(-80,-16,160,32,LIME,3);txt('CONNECTED AT 56K!',0,1,12,INK,{ol:0});ctx.restore()}
  if(t>=2.5)flash(1-pr(t,2.5,2.7));
}

function sTitle(t,T){
  burst(240,120,t*.35,ORANGE,'#ffc23a');
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(240,120,120+Math.sin(t*6)*6,0,Math.PI*2);ctx.fill();
  ORBIT.forEach((n,i)=>{const k=eBack(pr(t,.5+i*.08,.9+i*.08));if(k<=0)return;const a=t*.7+i*Math.PI*2/ORBIT.length;spr(n,240+Math.cos(a)*205,122+Math.sin(a)*78+Math.sin(t*8+i)*3,2*k)});
  if(t>0){const y=lerp(-20,52,eBounce(pr(t,0,.4)));txt('TOTALLY',240,y,24,LIME,{ol:3,sh:INK,sd:4})}
  'RADIMALS'.split('').forEach((c,i)=>{const k=pr(t,.2+i*.1,.65+i*.1);if(k<=0)return;const y=lerp(-60,108,eBounce(k))+Math.sin(t*5+i*.7)*(t>1.5?3:0);txt(c,240+(i-3.5)*30,y,48,PAPER,{ol:4,sh:BONDI,sd:6})});
  if(t>1.2){const k=pr(t,1.2,1.45);ctx.save();ctx.translate(410,148);ctx.rotate(-.25);const s=lerp(3,1,eOut(k));ctx.scale(s,s);txt("'98",0,0,40,PINK,{ol:4,sh:INK,sd:4});ctx.restore()}
  if(t>2){const k=eBack(pr(t,2,2.35));ctx.save();ctx.translate(78,58);ctx.scale(k,k);star(0,0,46,34,14,t*.8,PINK);txt('151',0,-5,24,PAPER,{ol:3});txt('TO COLLECT!',0,16,8,LIME,{ol:1});ctx.restore()}
  if(t>3){const w=eOut(pr(t,3,3.3))*W;ctx.fillStyle=INK;ctx.fillRect(W/2-w/2,196,w,26);if(t>3.2)txt('The most radical monster-collecting game of the century*',240,209,18,PAPER,{f:'VT323',ol:0})}
  if(t>4.4)txt("*of this century. it's 1998.",240,236,18,INK,{f:'VT323',ol:0});
  flash(1-pr(t,0,.18));
}

function card(name,x,y,dim){
  box(x-70,y-54,140,104,PAPER,3);ctx.drawImage(HE[name],x-64,y-48,128,64);
  box(x-64,y+20,128,22,'#fff',2);txt(name.toUpperCase(),x-58,y+31,8,INK,{a:'left',ol:0});tag(BY[name].type,x+62-tw(BY[name].type.toUpperCase(),8)-8,y+24,8);
  if(dim)flash(dim,NAVY);
}
function sStarters(t,T){
  const A=1.4,D=2.6;
  if(t<A||t>=A+3*D){
    dots(NAVY,'#24425a');
    const k=eBack(pr(t-(t<A?0:A+3*D),0,.35));
    txt(t<A?'CHOOSE YOUR STARTER!':'PICK ONE. OR ALL THREE.',240,lerp(-30,40,k),24,PAPER,{ol:3,sh:BONDI,sd:4});
    STARTERS.forEach((n,i)=>{const kk=t<A?eBack(pr(t,.2+i*.2,.6+i*.2)):eBack(pr(t,A+3*D+i*.06,A+3*D+.2+i*.06));card(n,90+i*150,lerp(330,150,kk)+Math.sin(t*6+i)*2)});
    if(t>=A+3*D)flash(1-pr(t,A+3*D,A+3*D+.1));
    return;
  }
  const i=Math.floor((t-A)/D),lt=t-A-i*D,n=STARTERS[i],r=BY[n];
  hero(n,1+lt*.03,0,-10);
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,30);

function startSession(offset){
  stopSession();if(!AC)return;
  const g=AC.createGain();g.connect(master);
  sess={g,base:AC.currentTime+.06-offset,step:Math.ceil(offset/STEP-1e-6),ev:EV.findIndex(e=>e.t>=offset-1e-6)};
  if(sess.ev<0)sess.ev=EV.length;

}
function stopSession(){if(!sess)return;const g=sess.g;g.gain.setTargetAtTime(0,AC.currentTime,.015);setTimeout(()=>g.disconnect(),300);sess=null}
function schedule(){
  if(!sess)return;const horizon=AC.currentTime-sess.base+.25;
  while(sess.step*STEP<horizon&&sess.step*STEP<DUR){music(sess.step,sess.base+sess.step*STEP);sess.step++}
  while(sess.ev<EV.length&&EV[sess.ev].t<horizon){const e=EV[sess.ev++];e.f(sess.base+e.t)}
}
